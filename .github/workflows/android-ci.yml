name: Android CI & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-debug:
    name: Build Debug APK
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          RELEASE_VERSION: dev-${{ github.sha }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          export RELEASE_VERSION="dev-${SHORT_SHA}"
          gradle assembleDebug --no-configuration-cache
          cp app/build/outputs/apk/debug/app-debug.apk "FluxCore-dev-${SHORT_SHA}-debug.apk"
          echo "APK_NAME=FluxCore-dev-${SHORT_SHA}-debug.apk" >> "$GITHUB_ENV"

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 14

  build-release:
    name: Build & Publish Signed Release APK
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Decode Release Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/release.jks"
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Signed Release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          export RELEASE_VERSION="${TAG#v}"
          gradle assembleRelease --no-configuration-cache
          APK_FILE="FluxCore-${TAG}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_FILE}"
          sha256sum "${APK_FILE}" > "${APK_FILE}.sha256"
          echo "RELEASE_APK=${APK_FILE}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${APK_FILE}.sha256" >> "$GITHUB_ENV"

      - name: Clean up Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/release.jks"

      - name: Attach Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_SHA }}
